[tox]
envlist = compliance,integration-tests




[testenv:compliance]
skip_install = True
deps =
    black==24.3.0
    flake8
stoponfail = True
commands =
    black --check redisbench_admin
    flake8 redisbench_admin

[testenv:format]
skip_install = True
deps =
    black==24.3.0
commands =
    black redisbench_admin

[testenv:integration-tests]
deps =
    -r{toxinidir}/dev_requirements.txt
    pytest-cov
    tox-docker
docker =
    rts_datasink
    db_server
    client_server
    pg_datasink

passenv = TST_BUILDER_X,TST_RUNNER_X,GH_TOKEN,TST_REDIS_DIR,DOCKER_HOST,DOCKER_TLS_VERIFY,DOCKER_CERT_PATH,TST_BINARY_REDIS_DIR,RUN_REMOTE_TESTS,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_DEFAULT_REGION,AWS_SESSION_TOKEN,EC2_PRIVATE_PEM,DB_SERVER_HOST,CLIENT_SERVER_HOST


stoponfail = True
commands =
    coverage erase
    pytest --cov=redisbench_admin --cov-report=term-missing -ra {posargs}
    coverage xml

[testenv:postgres-tests]
deps =
    -r{toxinidir}/dev_requirements.txt
    pytest-cov
    tox-docker
docker =
    pg_datasink
passenv = DOCKER_HOST,DOCKER_TLS_VERIFY,DOCKER_CERT_PATH
stoponfail = True
commands =
    pytest -ra tests/test_postgres.py {posargs}

[docker]
docker_host = unix:///var/run/docker.sock

docker =
    rts_datasink
    db_server
    client_server
    pg_datasink


[docker:rts_datasink]
image = redis/redis-stack-server:7.4.0-v0
# Expose ports to the testenv
expose =
    RTS_PORT=6379/tcp

healthcheck_cmd = redis-cli ping
healthcheck_interval = 1
healthcheck_timeout = 3
healthcheck_retries = 30

[docker:db_server]
image = ghcr.io/linuxserver/openssh-server
expose =
    DB_SERVER_PORT=2222/tcp
environment =
    PUBLIC_KEY_DIR=/test-ssh
    PUBLIC_KEY=tox_rsa.pub
    USER_NAME=ubuntu
volumes =
    bind:ro:{toxinidir}/tests/test_data/test-ssh/pub:/test-ssh

[docker:client_server]
image = ghcr.io/linuxserver/openssh-server
expose =
    CLIENT_SERVER_PORT=2222/tcp
environment =
    PUBLIC_KEY_DIR=/test-ssh
    PUBLIC_KEY=tox_rsa.pub
    USER_NAME=ubuntu
volumes =
    bind:ro:{toxinidir}/tests/test_data/test-ssh/pub:/test-ssh

[docker:pg_datasink]
image = postgres:16-alpine
expose =
    PG_PORT=5432/tcp
environment =
    POSTGRES_PASSWORD=redisbench
    POSTGRES_USER=postgres
    POSTGRES_DB=search
healthcheck_cmd = pg_isready -U postgres -d search
healthcheck_interval = 1
healthcheck_timeout = 3
healthcheck_retries = 60
