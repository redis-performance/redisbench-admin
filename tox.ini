[tox]
envlist = compliance,integration-tests




[testenv:compliance]
skip_install = True
deps =
    black
    flake8
stoponfail = True
commands =
    black --check redisbench_admin
    flake8 redisbench_admin

[testenv:integration-tests]
deps =
    -r{toxinidir}/dev_requirements.txt
    pytest-cov
stoponfail = True
commands =
    coverage erase
    pytest --cov=redisbench_admin --cov-report=term-missing -ra {posargs}
    coverage xml

[docker]
docker_host = unix:///var/run/docker.sock

docker =
    rts_datasink
    db_server
    client_server


[docker:rts_datasink]
image = redis/redis-stack-server:7.2.0-v11
ports =
    16379:6379/tcp

[docker:db_server]
image = ghcr.io/linuxserver/openssh-server
ports =
    2222:2222/tcp
environment =
    PUBLIC_KEY_DIR=/test-ssh
    PUBLIC_KEY=tox_rsa.pub
    USER_NAME=ubuntu
volumes =
    bind:ro:{toxinidir}/tests/test_data/test-ssh/pub:/test-ssh

[docker:client_server]
image = ghcr.io/linuxserver/openssh-server
ports =
    222:2222/tcp
environment =
    PUBLIC_KEY_DIR=/test-ssh
    PUBLIC_KEY=tox_rsa.pub
    USER_NAME=ubuntu
volumes =
    bind:ro:{toxinidir}/tests/test_data/test-ssh/pub:/test-ssh
