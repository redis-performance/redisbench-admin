name: Run Tests using tox
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  pytest:
    strategy:
      matrix:
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
      fail-fast: false
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
      USING_COVERAGE: "3.11"
      USING_COVERAGE_OS: "ubuntu-latest"

    runs-on: "ubuntu-latest"
    name: os ${{ matrix.os }} python ${{ matrix.python-version }} Linting, testing, and compliance
    steps:
    - uses: actions/checkout@master

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -

    - name: Install Dev requirements
      run: |
        pip install -U setuptools wheel
        pip install -r dev_requirements.txt

    - name: Set Submodules
      run: |
        git submodule update --init --recursive

    - name: Install Redis and memtier_benchmark
      run: |
        sudo apt install lsb-release curl gpg -y
        curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/redis-archive-keyring.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/redis.list
        sudo apt-get update
        sudo apt-get install redis -y
        sudo systemctl stop redis-server

        sudo apt-get install build-essential autoconf automake libevent-dev pkg-config zlib1g-dev libssl-dev clang-format -y
        git clone https://github.com/redis/memtier_benchmark --depth 1
        cd memtier_benchmark
        git checkout 1e7877b59dfe7d0f309e4e88ff0d2af6433a76d9 # added --monitor-input support
        autoreconf -ivf
        ./configure
        make -j
        sudo make install
        cd ..
        sudo rm -rf ./memtier_benchmark
        
        echo "memtier_benchmark version"
        memtier_benchmark --version
  
    - name: Install ftsb
      run: |
        wget -c https://github.com/RediSearch/ftsb/releases/latest/download/ftsb_redisearch_$(uname -mrs | awk '{ print tolower($1) }')_$(dpkg --print-architecture).tar.gz -O - | tar -xz
        sudo mv ftsb_redisearch /usr/local/bin/

    - name: Run tox
      env:
        TOX_DOCKER_GATEWAY: "0.0.0.0"
      run: |
        tox

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
      if: contains(env.USING_COVERAGE, matrix.python-version)
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        fail_ci_if_error: true
