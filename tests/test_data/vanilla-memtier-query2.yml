
name: "vanilla-memtier-query2"
setups:
  - oss-standalone
  - oss-cluster-02-primaries

remote:
 - type: oss-standalone
 - setup: redisearch-m5
 
# This benchmark uses the dataset produced by vanilla-memtier-load.yml
# The dataset_name in dbconfig indicates which dataset this benchmark needs.
dbconfig:
  tool: memtier_benchmark
  dataset_name: "vanilla-memtier"
  arguments: "--ratio 1:0 --key-maximum 10000 --key-minimum 1 --key-pattern P:P -d 1 -n allkeys --hide-histogram"
  check:
   keyspacelen: 10000

clientconfig:
  benchmark_type: "read-only"
  tool: memtier_benchmark
  arguments: "-d 1000 --ratio 0:1 --test-time 5 --pipeline 15 --key-pattern=P:P -t 2 --hide-histogram --key-maximum=10000 --key-minimum 1"
