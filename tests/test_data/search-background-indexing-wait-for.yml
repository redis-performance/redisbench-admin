version: 0.5
name: "search-background-indexing-wait-for"
description: "Measures the RediSearch background indexing wall clock time: how long FT.INFO takes to report indexing: 0 after the index is created over an already loaded keyspace."

metadata:
  component: "search"

setups:
  - oss-standalone

remote:
  - type: oss-standalone
  - setup: redisearch-m7

dbconfig:
  # the keyspace must be loaded before the index is created, otherwise FT.CREATE
  # registers no background scan at all ( RediSearch only scans when DbSize > 0 )
  - dataset: "https://s3.amazonaws.com/benchmarks.redislabs/redisearch/datasets/1700K-docs-union-iterators/1700K-docs-union-iterators.rdb"
  - dataset_name: "1700K-docs-union-iterators-no-index"
  - init_commands:
    - '"FT.CREATE" "idx" "ON" "HASH" "PREFIX" "1" "doc:" "SCHEMA" "title" "TEXT" "body" "TEXT"'
  - wait_for:
    - name: "index_time"
      command: "FT.INFO idx"
      field: "indexing"
      eq: 0
      poll_interval_ms: 100
      timeout_secs: 1800
      # a background scan aborted by OOM also flips indexing back to 0, so refuse
      # to record a duration unless the whole keyspace really got indexed
      require:
        percent_indexed: 1
      record_fields:
        - num_docs
        - hash_indexing_failures

clientconfig:
  # this test measures a server side condition, the client is only here because
  # the runners require a benchmark tool. its results are not used
  benchmark_type: "mixed"
  tool: memtier_benchmark
  arguments: "--test-time 1 -c 1 -t 1 --ratio 0:1 --hide-histogram --command 'PING'"

kpis:
  - le:
      "$.Measurements.index_time_secs": 120

exporter:
  redistimeseries:
    break_by:
      - version
      - commit
    metrics:
      - "$.Measurements.index_time_secs"
      - "$.Measurements.index_time_num_docs"
  comparison:
    metrics:
      - "$.Measurements.index_time_secs"
    mode: lower-better
    baseline-branch: master
